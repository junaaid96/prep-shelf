<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrepShelf — Engineering Notes</title>
  <meta name="description" content="Engineering notes and interview prep, organised by topic." />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="progress-bar" id="progress-bar"></div>

  <div class="app">
    <!-- ══════════ Sidebar ══════════ -->
    <aside class="sidebar" id="sidebar" aria-label="Navigation">
      <header class="sidebar-header">
        <a href="#" class="brand" id="brand-link">
          <span class="brand-icon" aria-hidden="true">📚</span>
          <span class="brand-text">
            <strong>PrepShelf</strong>
            <small id="brand-sub">Engineering notes</small>
          </span>
        </a>
        <button class="icon-btn sidebar-close" id="sidebar-close" aria-label="Close menu">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </header>

      <div class="sidebar-search">
        <button class="search-trigger" id="search-trigger">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span class="label">Search everything…</span>
          <kbd id="search-kbd">Ctrl K</kbd>
        </button>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <button class="quick-link" data-view="home" id="link-home">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
          Home
        </button>
        <button class="quick-link" data-view="bookmarks" id="link-bookmarks">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          Bookmarks
          <span class="count" id="bookmark-count">0</span>
        </button>

        <div class="nav-section-title">Topics</div>
        <div id="topic-tree"></div>
      </nav>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- ══════════ Main ══════════ -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>

        <div class="breadcrumb" id="breadcrumb"><span class="current">Home</span></div>

        <div class="topbar-actions">
          <button class="icon-btn hidden" id="bookmark-btn" aria-label="Bookmark this note" title="Bookmark (b)">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          </button>
          <button class="icon-btn hidden" id="read-btn" aria-label="Mark as read" title="Mark as read (m)">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </button>
          <button class="icon-btn" id="shortcuts-btn" aria-label="Keyboard shortcuts" title="Shortcuts (?)">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/></svg>
          </button>
          <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme (t)">
            <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
          </button>
        </div>
      </header>

      <div class="content-layout">
        <article class="reader" id="reader" tabindex="-1">
          <div id="home-view"></div>
          <div class="markdown-body hidden" id="markdown-body"></div>
          <div id="note-footer"></div>
        </article>

        <aside class="toc-panel hidden" id="toc-panel" aria-label="On this page">
          <h2>On this page</h2>
          <nav id="toc-nav"></nav>
        </aside>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- vendored so the site works fully offline; refresh with scripts/update-vendor.sh -->
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
