<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrepShelf — Prep Notes</title>
  <meta name="description" content="Topic-wise prep notes and study guides" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <header class="sidebar-header">
        <a href="#" class="brand" id="brand-link">
          <span class="brand-icon" aria-hidden="true">📚</span>
          <span class="brand-text">
            <strong>PrepShelf</strong>
            <small>Prep notes by topic</small>
          </span>
        </a>
        <button class="icon-btn sidebar-close" id="sidebar-close" aria-label="Close menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </header>

      <div class="sidebar-search">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="search-input" placeholder="Search notes…" autocomplete="off" />
      </div>

      <div class="topic-filters" id="topic-filters" role="group" aria-label="Filter by topic">
        <button class="filter-chip active" data-topic="all">All</button>
      </div>

      <nav class="note-list" id="note-list" aria-label="Notes"></nav>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <div class="topbar-title" id="topbar-title">Select a note</div>
        <div class="topbar-actions">
          <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme">
            <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </header>

      <div class="content-layout">
        <article class="reader" id="reader">
          <div class="welcome" id="welcome">
            <div class="welcome-icon">📚</div>
            <h1>PrepShelf</h1>
            <p>Your prep notes, organized by topic. Pick a note from the sidebar or use search.</p>
            <div class="welcome-stats" id="welcome-stats"></div>
          </div>
          <div class="loading hidden" id="loading">Loading…</div>
          <div class="markdown-body hidden" id="markdown-body"></div>
        </article>

        <aside class="toc-panel hidden" id="toc-panel" aria-label="Table of contents">
          <h2>On this page</h2>
          <nav id="toc-nav"></nav>
        </aside>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
